<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vervetix Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            min-height: 100vh;
            background-color: #f4f6f9;
        }
        .sidebar {
            width: 250px;
            background-color: #1e293b;
            color: #fff;
            padding: 20px;
        }
        .sidebar h2 {
            margin-bottom: 30px;
            color: #38bdf8;
        }
        .sidebar ul {
            list-style: none;
        }
        .sidebar ul li {
            margin-bottom: 15px;
        }
        .sidebar ul li a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 16px;
            display: block;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .sidebar ul li a:hover {
            background-color: #334155;
            color: #fff;
        }
        .main-content {
            flex: 1;
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .card h3 {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .card p {
            font-size: 24px;
            font-weight: bold;
            color: #0f172a;
        }
        .whatsapp-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Vervetix</h2>
        <ul>
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Orders</a></li>
            <li><a href="#">Analytics</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Overview</h1>
        </div>

        <div class="cards">
            <div class="card">
                <h3>Total Sales</h3>
                <p>$12,450</p>
            </div>
            <div class="card">
                <h3>New Orders</h3>
                <p>128</p>
            </div>
            <div class="card">
                <h3>Visitors</h3>
                <p>3,420</p>
            </div>
        </div>

        <a href="https://wa.me/8801956692040?text=Hello,%20I%20want%20to%20order" target="_blank" class="whatsapp-btn">
            Order on WhatsApp
        </a>
    </div>

</body>
</html>
